name: Bug
description: Reportar um comportamento incorreto
title: "[prefixo] "
labels: ["tipo:bug", "triagem"]
body:
  - type: dropdown
    id: prefixo
    attributes:
      label: Prefixo da família
      description: Selecione a família e substitua [prefixo] no título acima pelo mesmo código (E, PIL, CAM, ENG, EQP, ALU)
      options:
        - E
        - PIL
        - CAM
        - ENG
        - EQP
        - ALU
    validations:
      required: true
  - type: textarea
    id: comportamento
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passo a passo para reproduzir
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
    validations:
      required: true
